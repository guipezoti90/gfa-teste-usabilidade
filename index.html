<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GFA · Gestão Financeira de Alocações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Design tokens — Annecy (globais) + tema Carrefour (brand)
   Fonte: zeroheight.com/7b02ac2be
   ============================================================ */
:root{
  --brand-00:#F0F2F6; --brand-01:#CCE0FF; --brand-02:#70A5FF; --brand-03:#002C7A; --brand:#1E5BC6;
  --hl-00:#FDE6F2;    --hl-01:#FFD2F0;    --hl-02:#FF79B4;    --hl-03:#840058;    --hl:#E6007E;
  --dark-01:#737479;  --dark-02:#5F646D;  --dark-03:#303236;  --dark:#000000;
  --light-01:#F8F9FA; --light-02:#F0F0F0; --light-03:#E4E5E7; --white:#FFFFFF;
  --danger-01:#FFECE9;--danger-02:#FFA4A2;--danger-03:#D10F1C;--danger:#FC5346;
  --ok-01:#E1FFEA;    --ok-02:#8AE8A6;    --ok-03:#087C2B;    --ok:#30C05B;
  --alert-01:#FAF1D7; --alert-02:#F0D275; --alert-03:#896804; --alert:#E6B319;

  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:28px; --r-full:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  --sidebar-w:220px; --topbar-h:64px; --footer-h:80px;
  --ease:cubic-bezier(.2,0,0,1); --ease-out:cubic-bezier(.05,.7,.1,1);
  --dur-1:120ms; --dur-2:200ms; --dur-3:320ms; --dur-4:480ms;
  --shadow-1:0 1px 2px rgba(48,50,54,.08), 0 1px 3px rgba(48,50,54,.06);
  --shadow-2:0 4px 12px rgba(48,50,54,.10);
  --shadow-3:0 12px 32px rgba(48,50,54,.18);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:"Open Sans",-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.45; color:var(--dark-03); background:var(--light-02);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brand-02); outline-offset:2px; border-radius:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============================================================
   Shell
   ============================================================ */
.app{display:flex;height:100vh;min-height:600px;overflow:hidden;background:var(--white)}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--brand);
  display:flex;flex-direction:column;color:#fff;position:relative;z-index:5
}
.brand{height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 20px;flex:0 0 auto;
  color:#fff;text-decoration:none}
.brand:visited,.brand:hover{color:#fff;text-decoration:none}
.brand .mark{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--brand);
  display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 auto;
  transition:transform var(--dur-2) var(--ease)}
.brand:hover .mark{transform:rotate(-6deg) scale(1.05)}
.brand b{display:block;font-size:13px;font-weight:700;letter-spacing:.2px}
.brand span{display:block;font-size:11px;opacity:.82}
.nav{padding:8px 12px;display:flex;flex-direction:column;gap:4px;flex:1 1 auto;overflow:auto}
.nav a{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-full);
  color:#fff;text-decoration:none;font-size:14px;position:relative;overflow:hidden;
  transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease)
}
.nav a .ico{width:20px;height:20px;flex:0 0 auto;opacity:.95}
.nav a:hover{background:rgba(255,255,255,.14)}
.nav a[aria-current="page"]{background:#fff;color:var(--brand);font-weight:600}
.nav a[aria-current="page"] .ico{opacity:1}
.nav .sep{height:1px;background:rgba(255,255,255,.2);margin:10px 14px}
.side-foot{padding:12px 20px 18px;font-size:11px;color:rgba(255,255,255,.7)}

.main{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;background:var(--white)}
.topbar{
  height:var(--topbar-h);flex:0 0 var(--topbar-h);background:var(--light-01);
  border-bottom:1px solid var(--light-03);display:flex;align-items:center;gap:16px;padding:0 20px 0 24px
}
.topbar .ctx{flex:1 1 auto;min-width:0}
.topbar .ctx b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ctx span{display:block;font-size:12px;color:var(--dark-02)}
.iconbtn{
  width:44px;height:44px;border-radius:var(--r-full);display:grid;place-items:center;position:relative;
  color:var(--dark-02);transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease)
}
.iconbtn:hover{background:var(--light-02);color:var(--dark-03)}
.iconbtn.filled{background:var(--brand);color:#fff}
.iconbtn.filled:hover{background:var(--brand-03)}
.iconbtn .badge{
  position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-full);
  background:var(--danger-03);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;
  border:2px solid var(--light-01)
}
.topbar .divider{width:1px;height:28px;background:var(--light-03)}
.account{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--r-full);
  transition:background var(--dur-2) var(--ease)}
.account:hover{background:var(--light-02)}
.avatar{width:36px;height:36px;border-radius:var(--r-full);background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:600;flex:0 0 auto}
.account .who{text-align:left;line-height:1.25}
.account .who b{display:block;font-size:13px;font-weight:600}
.account .who span{display:block;font-size:11px;color:var(--dark-02)}
.account .chev{color:var(--dark-02);transition:transform var(--dur-2) var(--ease)}
.account[aria-expanded="true"] .chev{transform:rotate(180deg)}

.content{flex:1 1 auto;overflow:auto;padding:24px 32px;scroll-behavior:smooth}
.content>*+*{margin-top:24px}
.footerbar{
  flex:0 0 var(--footer-h);height:var(--footer-h);background:var(--light-01);border-top:1px solid var(--light-03);
  display:flex;align-items:center;gap:16px;padding:16px 32px
}
.footerbar[hidden]{display:none}
.footerbar .hint{flex:1 1 auto;font-size:13px;color:var(--dark-02)}
.footerbar .hint.err{color:var(--danger-03)}

/* ============================================================
   Tipografia e blocos
   ============================================================ */
h1{font-size:28px;line-height:1.2;margin:0;font-weight:700}
h2{font-size:16px;margin:0;font-weight:600}
h3{font-size:14px;margin:0;font-weight:600}
.page-head{display:flex;align-items:flex-start;gap:16px}
.page-head .t{flex:1 1 auto;min-width:0}
.page-head .sub{margin-top:4px;font-size:13px;color:var(--dark-02)}
.card{background:var(--white);border:1px solid var(--light-03);border-radius:var(--r-md)}
.card.pad{padding:20px 24px}
.muted{color:var(--dark-02)}
.tiny{font-size:12px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dark-02)}

/* Pills de status */
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--r-full);
  font-size:12px;font-weight:600;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:var(--r-full);flex:0 0 auto}
.s-aberto     {background:var(--brand-00);color:var(--brand-03)}  .s-aberto .dot{background:var(--brand-02)}
.s-consultoria{background:var(--brand-01);color:var(--brand-03)}  .s-consultoria .dot{background:var(--brand)}
.s-aprovacao  {background:var(--alert-01);color:var(--alert-03)}  .s-aprovacao .dot{background:var(--alert)}
.s-gestor     {background:var(--hl-00);color:var(--hl-03)}        .s-gestor .dot{background:var(--hl)}
.s-correcao   {background:var(--danger-01);color:var(--danger-03)}.s-correcao .dot{background:var(--danger)}
.s-concluido  {background:var(--ok-01);color:var(--ok-03)}        .s-concluido .dot{background:var(--ok)}
.s-cancelado  {background:var(--light-02);color:var(--dark-02)}   .s-cancelado .dot{background:var(--dark-01)}

/* ============================================================
   Botões (com ripple)
   ============================================================ */
.btn{
  position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:48px;padding:0 24px;border-radius:var(--r-full);font-size:14px;font-weight:600;
  transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease),
             box-shadow var(--dur-2) var(--ease),transform var(--dur-1) var(--ease),opacity var(--dur-2) var(--ease);
  white-space:nowrap;user-select:none
}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-filled{background:var(--brand);color:#fff}
.btn-filled:hover:not(:disabled){background:var(--brand-03);box-shadow:var(--shadow-2)}
.btn-outline{background:transparent;color:var(--dark-03);box-shadow:inset 0 0 0 1px var(--dark-01)}
.btn-outline:hover:not(:disabled){background:var(--brand-00)}
.btn-text{background:transparent;color:var(--brand);padding:0 16px}
.btn-text:hover:not(:disabled){background:var(--brand-00)}
.btn-danger{background:var(--danger-03);color:#fff}
.btn-danger:hover:not(:disabled){background:#a80c16;box-shadow:var(--shadow-2)}
.btn-sm{height:40px;padding:0 18px;font-size:13px}
.btn-xs{height:34px;padding:0 14px;font-size:12px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.28;
  pointer-events:none;animation:ripple var(--dur-4) var(--ease-out) forwards}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}

/* ============================================================
   Campos
   ============================================================ */
.field{position:relative;display:block}
.field>label{
  position:absolute;left:12px;top:-8px;padding:0 6px;background:var(--white);
  font-size:12px;color:var(--dark-02);pointer-events:none;transition:color var(--dur-2) var(--ease)
}
.field input,.field textarea,.field select{
  width:100%;height:56px;padding:0 16px;border-radius:4px;background:var(--white);
  border:1px solid var(--dark-01);transition:border-color var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease)
}
.field textarea{height:auto;min-height:96px;padding:14px 16px;resize:vertical;line-height:1.5}
.field input:hover,.field textarea:hover{border-color:var(--dark-03)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.field input:focus+label,.field textarea:focus+label{color:var(--brand)}
.field .help{display:block;margin:4px 16px 0;font-size:12px;color:var(--dark-02)}
.field.err input,.field.err textarea{border-color:var(--danger-03);box-shadow:inset 0 0 0 1px var(--danger-03)}
.field.err>label,.field.err .help{color:var(--danger-03)}
.field.err input:focus,.field.err textarea:focus{box-shadow:inset 0 0 0 2px var(--danger-03)}
.field .lead{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dark-02);pointer-events:none}
.field.has-lead input{padding-left:48px}
.row{display:flex;gap:16px}
.row>*{flex:1 1 0;min-width:0}

/* Banners */
.banner{border-radius:var(--r-md);padding:16px 20px;display:flex;gap:12px;align-items:flex-start}
.banner b{display:block;font-size:14px;margin-bottom:2px}
.b-info{background:var(--brand-01);color:var(--brand-03)}
.b-ok{background:var(--ok-01);color:var(--ok-03)}
.b-err{background:var(--danger-01);color:var(--danger-03);border:1px solid var(--danger-03)}
.b-alert{background:var(--alert-01);color:var(--alert-03)}
.b-neutral{background:var(--light-01);color:var(--dark-03);border:1px solid var(--light-03)}
</style>
<style>
/* ============================================================
   Totalizadores, busca, tabela
   ============================================================ */
.totais{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;align-items:stretch}
.tot{
  text-align:left;background:var(--white);border:1px solid var(--light-03);border-radius:var(--r-md);
  padding:14px 16px;transition:border-color var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease),
  transform var(--dur-2) var(--ease);position:relative;overflow:hidden
}
.tot:hover{border-color:var(--brand-02);box-shadow:var(--shadow-1);transform:translateY(-2px)}
.tot[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
/* contador de status: o ponto sobe para a linha do rótulo, o número vira o herói */
.tot{display:flex;flex-direction:column;gap:2px}
.tot .hd{display:flex;align-items:center;gap:8px;min-height:18px}
.tot .hd .dot{flex:0 0 auto;width:9px;height:9px;border-radius:var(--r-full)}
.tot .lbl{font-size:12px;font-weight:600;color:var(--dark-02);text-align:left}
.tot .n{display:block;font-size:26px;font-weight:600;line-height:1.15;color:var(--dark-03)}
.tot .val{display:block;font-size:12px;color:var(--dark-02)}

/* card de métrica: quadrado de ícone + rótulo/valor/legenda */
.kpis{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px;align-items:stretch}
.kpi{display:flex;gap:14px;align-items:center;background:var(--white);
  border:1px solid var(--light-03);border-radius:var(--r-md);padding:16px 18px}
.kpi.hl{background:var(--light-01)}
.kpi .ico{flex:0 0 40px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.kpi .ico svg{width:20px;height:20px;stroke-width:1.8}
.kpi .ico.brand {background:var(--brand-01); color:var(--brand-03)}
.kpi .ico.ok    {background:var(--ok-01);    color:var(--ok-03)}
.kpi .ico.alert {background:var(--alert-01); color:var(--alert-03)}
.kpi .ico.danger{background:var(--danger-01);color:var(--danger-03)}
.kpi .ico.neutro{background:var(--light-02); color:var(--dark-02)}
.kpi .t{min-width:0;display:flex;flex-direction:column;gap:1px}
.kpi .t .lbl{font-size:12px;color:var(--dark-02)}
.kpi .t .v{font-size:22px;font-weight:600;line-height:1.25;color:var(--dark-03)}
.kpi .t .cap{font-size:12px;color:var(--dark-02)}
.kpi .t .cap.alert{color:var(--alert-03)} .kpi .t .cap.ok{color:var(--ok-03)}
.kpi .t .cap.danger{color:var(--danger-03)}
@media (max-width:1180px){ .kpis{grid-auto-flow:row;grid-template-columns:repeat(2,1fr)!important} }

.toolbar{display:flex;gap:12px;align-items:center}
.toolbar .field{flex:1 1 auto}
.chipcount{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-full);
  background:var(--brand);color:#fff;font-size:11px;font-weight:700}

.tbl{width:100%;border-collapse:collapse;background:var(--white)}
.tbl th{
  text-align:left;font-size:12px;font-weight:600;color:var(--dark-02);padding:12px 16px;
  border-bottom:1px solid var(--light-03);white-space:nowrap
}
.tbl th.num,.tbl td.num{text-align:right}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--light-03);vertical-align:middle}
.tbl tbody tr{transition:background var(--dur-1) var(--ease)}
.tbl tbody tr:hover{background:var(--brand-00)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .strong{font-weight:600}
.tbl .sub{font-size:12px;color:var(--dark-02);margin-top:2px}
.tbl mark{background:var(--alert-02);color:var(--dark-03);border-radius:3px;padding:0 2px}
.tablewrap{border:1px solid var(--light-03);border-radius:var(--r-md);overflow:hidden}
.tablefoot{display:flex;align-items:center;gap:12px;padding:12px 16px;font-size:12px;color:var(--dark-02);
  background:var(--white)}
.pager{margin-left:12px;display:flex;gap:4px}
.pager button{width:30px;height:30px;border-radius:var(--r-sm);font-size:12px;color:var(--dark-02)}
.pager button[aria-current="true"]{background:var(--brand);color:#fff;font-weight:700}
.pager button:hover:not([aria-current="true"]){background:var(--light-02)}

/* Estados de página */
.state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:72px 40px}
.state .ico{width:64px;height:64px;border-radius:var(--r-full);display:grid;place-items:center;font-size:26px}
.state.ok .ico{background:var(--brand-00);color:var(--brand)}
.state.bad .ico{background:var(--danger-01);color:var(--danger-03)}
.state h2{font-size:22px}
.state p{margin:0;max-width:560px;color:var(--dark-02)}
.state .acts{display:flex;gap:12px;margin-top:8px}
.skel{background:linear-gradient(90deg,var(--light-02) 25%,var(--light-03) 37%,var(--light-02) 63%);
  background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:var(--r-sm)}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ============================================================
   Trilha do processo
   ============================================================ */
.trilha{background:var(--light-01);border-radius:var(--r-md);padding:16px 24px}
.trilha .k{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--brand);text-transform:uppercase}
.trilha.dev .k{color:var(--danger-03)}
.steps{display:flex;margin-top:12px}
.step{flex:1 1 0;min-width:0}
.step .mk{display:flex;align-items:center;height:20px}
.step .bul{width:14px;height:14px;border-radius:var(--r-full);background:var(--light-03);flex:0 0 auto;
  transition:background var(--dur-3) var(--ease),transform var(--dur-3) var(--ease)}
.step .bar{height:2px;flex:1 1 auto;background:var(--light-03);transition:background var(--dur-4) var(--ease)}
.step:last-child .bar{opacity:0}
.step.done .bul,.step.done .bar{background:var(--brand)}
.step.now .bul{background:var(--brand);width:18px;height:18px;box-shadow:0 0 0 4px var(--brand-01)}
.step.now.warn .bul{background:var(--danger);box-shadow:0 0 0 4px var(--danger-01)}
.step.warn.done .bul,.step.warn.done .bar{background:var(--danger)}
.step .t{margin-top:8px;font-size:13px;font-weight:600}
.step .d{font-size:12px;color:var(--dark-02)}
.step.todo .t{color:var(--dark-01);font-weight:400}
.step.now .t{color:var(--brand)}
.step.now.warn .t,.step.now.warn .d,.step.warn.done .t{color:var(--danger-03)}

/* Resumo / métricas */
.resumo{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.resumo .c .k{font-size:12px;color:var(--dark-02)}
.resumo .c .v{font-size:14px;font-weight:600;margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.metric{border:1px solid var(--light-03);border-radius:var(--r-md);padding:14px 18px;background:var(--white)}
.metric.hi{background:var(--light-01)}
.metric .k{font-size:12px;color:var(--dark-02)}
.metric .v{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.metric .d{font-size:12px;color:var(--dark-02);margin-top:2px}
.metric .d.warn{color:var(--alert-03);font-weight:600}
.metric .d.bad{color:var(--danger-03);font-weight:600}

/* Duas colunas */
.cols{display:grid;grid-template-columns:1fr 400px;gap:24px;align-items:start}
.side{display:flex;flex-direction:column;gap:12px}
.side .box{border-radius:var(--r-md);padding:16px 20px}
.side .box.n{background:var(--light-01);border:1px solid var(--light-03)}
.side .box .k{font-size:13px;font-weight:600}
.side .box .big{font-size:28px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.side .box p{margin:0;font-size:13px}

/* Histórico */
.hist{background:var(--light-01);border:1px solid var(--light-03);border-radius:var(--r-md);padding:14px 20px}
.hist .hd{display:flex;align-items:center;gap:8px}
.hist .hd b{flex:1 1 auto;font-size:13px}
.hist .hd span{font-size:12px;color:var(--dark-02)}
.hist ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{display:flex;gap:10px;align-items:center}
.hist li .bul{width:8px;height:8px;border-radius:var(--r-full);background:var(--light-03);flex:0 0 auto;margin-top:2px}
.hist li .tx{flex:1 1 auto;min-width:0}
.hist li .tx b{display:block;font-size:14px;font-weight:400}
.hist li .tx span{display:block;font-size:12px;color:var(--dark-02)}
.hist li.dev{background:var(--danger-01);border-radius:var(--r-sm);padding:10px 12px}

/* kpi({l,v,cap,capTom,ico,tom,hl}) */
function kpi(o){

function ripple(e){
  const b=e.currentTarget; if(b.disabled) return;
  const r=b.getBoundingClientRect(), s=Math.max(r.width,r.height);
  const el=document.createElement('span'); el.className='ripple';
  el.style.width=el.style.height=s+'px';
  el.style.left=(e.clientX-r.left-s/2)+'px'; el.style.top=(e.clientY-r.top-s/2)+'px';
  b.appendChild(el); setTimeout(()=>el.remove(),480);

function countUp(el,to,dur=600,fmt=NUM){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent=fmt(to); return; }
  const t0=performance.now();
  (function tick(t){ const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    el.textContent=fmt(Math.round(to*e)); if(k<1) requestAnimationFrame(tick); })(t0);
}
function toast(msg,{kind='',action=null,onAction=null,ms=5200}={}){
  const el=document.createElement('div'); el.className='toast '+kind;
  el.innerHTML=`<b>${esc(msg)}</b>`;
  if(action){ const b=document.createElement('button'); b.textContent=action;
    b.onclick=()=>{ onAction&&onAction(); close(); }; el.appendChild(b); }
  const box=$('#toasts'); box.appendChild(el);
  while(box.children.length>3) box.firstElementChild.remove();
  function close(){ el.classList.add('out'); setTimeout(()=>el.remove(),200); }
  setTimeout(close,ms); return close;
}
const D    = s => { const [y,m,d]=String(s).split('-').map(Number); return new Date(y,m-1,d); };
const dISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

/* --- dica (tooltip de ajuda) — usada pelas telas de NF e carta de correção --- */
let _tipTimer=null, _tipAtual=null;
function dica(texto,rotulo){
  if(!texto) return '';
  return `<button type="button" class="ihelp" aria-expanded="false"
    aria-label="Ajuda${rotulo?': '+esc(rotulo):''}" data-dica="${esc(texto)}"
    onmouseenter="dicaAbrir(this)" onmouseleave="dicaFechar()"
    onfocus="dicaAbrir(this)" onblur="dicaFechar()"
    onclick="event.preventDefault();event.stopPropagation();dicaAlternar(this)"
    >${icon(I.info,15)}</button>`;
}
function dicaAbrir(btn){
  clearTimeout(_tipTimer);
  const t=$('#tip'); if(!t) return;
  if(_tipAtual&&_tipAtual!==btn) _tipAtual.setAttribute('aria-expanded','false');
  _tipAtual=btn;
  t.textContent=btn.dataset.dica||'';
  t.hidden=false;
  t.style.left='-9999px'; t.style.top='0px';
  const r=btn.getBoundingClientRect(), tw=t.offsetWidth, th=t.offsetHeight;
  let x=r.left+r.width/2-tw/2, y=r.top-th-8;
  if(y<8) y=r.bottom+8;
  x=Math.max(8,Math.min(x,innerWidth-tw-8));
  t.style.left=Math.round(x)+'px'; t.style.top=Math.round(y)+'px';
  t.classList.add('on');
  btn.setAttribute('aria-expanded','true');
}
function dicaFechar(){
  clearTimeout(_tipTimer);
  _tipTimer=setTimeout(()=>{
    const t=$('#tip'); if(!t) return;
    t.classList.remove('on'); t.hidden=true;
    if(_tipAtual){ _tipAtual.setAttribute('aria-expanded','false'); _tipAtual=null; }

/* No mouse a dica já abriu no hover — clicar não pode fechá-la, senão o clique
   parece um bug. No toque, onde não existe hover, o clique é o único gesto: alterna. */
function dicaAlternar(btn){
  const t=$('#tip');
  const aberto=_tipAtual===btn && t && t.classList.contains('on');
  const temHover = matchMedia('(hover: hover)').matches;
  if(aberto && !temHover) dicaFechar(); else dicaAbrir(btn);
}
addEventListener('keydown',e=>{ if(e.key==='Escape') dicaFechar(); });

let lastFocus=null, trapEl=null;
function trapFocus(el){ lastFocus=document.activeElement; trapEl=el;
  const f=el.querySelector('input,textarea,button:not([disabled]),select,[tabindex]:not([tabindex="-1"])');
  setTimeout(()=>f&&f.focus(),60); }

      .filter(el=>el.offsetParent!==null);
    if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }

/* ============================================================

let popAtual=null;
function ensurePop(){
  let p=$('#pop');
  if(!p){ p=document.createElement('div'); p.className='pop'; p.id='pop'; document.body.appendChild(p); }
  return p;
}
function abrirPop(anchor,html,{w=null,onOpen=null}={}){
  const p=ensurePop(); p.innerHTML=html; if(w) p.style.width=(typeof w==='number'?w+'px':w); else p.style.width='';
  p.classList.add('on');
  posicionarPop(anchor);
  popAtual={anchor,el:p};
  anchor.closest('.dl')&&anchor.closest('.dl').classList.add('open');
  bindRipples(p); onOpen&&onOpen(p);

}
function posicionarPop(anchor){
  const p=$('#pop'); if(!p) return;
  const r=anchor.getBoundingClientRect(); const pw=p.offsetWidth||320, ph=p.offsetHeight||280;
  let left=r.left, top=r.bottom+6;
  if(left+pw>innerWidth-12) left=Math.max(12,innerWidth-pw-12);
  if(top+ph>innerHeight-12) top=Math.max(12,r.top-ph-6);
  p.style.left=left+'px'; p.style.top=top+'px';
}
function fecharPop(){
  const p=$('#pop'); if(!p) return;

}
document.addEventListener('mousedown',e=>{
  if(!popAtual) return;
  if(popAtual.el.contains(e.target)||popAtual.anchor.contains(e.target)) return;

addEventListener('scroll',e=>{

/* ============================================================

   com flip para cima quando não cabe. Item destrutivo sempre por último,

const MENUS={};
function menuAcoes(btn, itens, largura){
  if(popAtual&&popAtual.anchor===btn){ fecharPop(); return; }
  const id='mn'+(++_mnSeq);

      : `<button role="menuitem" class="mi${it.danger?' danger':''}" ${it.off?'disabled aria-disabled="true"':''}
           onclick="menuEscolher('${id}',${i})">
           <span class="l">${esc(it.l)}</span>
           ${it.motivo?`<span class="m">${esc(it.motivo)}</span>`:''}</button>`).join('')}</div>`;
  abrirPop(btn, html, {w:largura||280, onOpen:p=>{
    /* ancora pela direita do gatilho */

    let left=r.right-pw; if(left<12) left=12;
    if(left+pw>innerWidth-12) left=Math.max(12,innerWidth-pw-12);

    const primeiro=p.querySelector('.mi:not([disabled])'); primeiro&&primeiro.focus();

}
let _mnSeq=0;
function menuEscolher(id,i){

}
document.addEventListener('keydown',e=>{
  const p=$('#pop'); if(!popAtual||!p||!p.querySelector('.mnu')) return;

  const at=its.indexOf(document.activeElement);
  if(e.key==='ArrowDown'){ e.preventDefault(); its[(at+1+its.length)%its.length].focus(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); its[(at-1+its.length)%its.length].focus(); }

function dlTrigger(id,label,opts){

    inner = sel.length

             aria-label="Limpar">${icon(I.x,12)}</i></span>`
      : `<span class="val ph">${esc(placeholder||'Selecione')}</span>`;
  }

    <button type="button" class="trigger" aria-haspopup="listbox" aria-expanded="false"

const DL={};
function dlInit(id,{opcoes,sel,multi,label,placeholder,onChange,dica:dk}){

function dlRepaint(id){

function dlPick(id,v){

function totAloc(){
  const c=k=>state.alocs.filter(a=>a.st===k);

  const cards=[['todas','Todas as alocações',state.alocs,'var(--brand)'],
    ['rascunho','Rascunho',c('rascunho'),'var(--dark-01)'],
    ['aguardando','Aguardando proposta',c('aguardando').concat(c('proposta')),'var(--alert)'],
    ['contratacao','Em contratação',c('contratacao'),'var(--brand)'],
    ['avincular','A vincular',c('avincular'),'var(--hl)'],
    ['ativa','Ativas',c('ativa'),'var(--ok)']];
  return `<div class="totais" style="grid-template-columns:repeat(6,1fr)">${cards.map(([k,l,lista,cor])=>
    `<div class="tot${state.filtro===k?' sel':''}" role="button" tabindex="0" onclick="filtrarAloc('${k}')">
      <div class="hd"><i class="dot" style="background:${cor}"></i><span class="lbl">${l}</span></div>
      <b class="n">${lista.length}</b><span class="val">${BRL(v(lista))}</span></div>`).join('')}</div>`;
}
function filtrarAloc(k){ state.filtro = state.filtro===k?null:(k==='todas'?null:k); telaAloc(); }
function alocVisiveis(){
  const q=state.busca.trim().toLowerCase();
  return state.alocs.filter(a=>{
    if(state.filtro==='aguardando' && !['aguardando','proposta'].includes(a.st)) return false;
    if(state.filtro && state.filtro!=='aguardando' && a.st!==state.filtro) return false;
    if(!q) return true;
    return [a.squad,a.cons,a.pedido,a.id].join(' ').toLowerCase().includes(q);
  });
}
function telaAloc(){
  const lista=alocVisiveis();
  const linhas = lista.length ? lista.map(a=>{
    const sub = a.trilha==='squad' ? `Por squad · ${esc(a.cons)}` : `Por posições · ${a.pos} posições · ${esc(a.cons)}`;
    const vinc = a.vinc ? `<div class="sub" style="margin:0 0 4px">${a.vinc} de ${a.pos} vinculadas</div>
        <div class="vbar"><i style="width:${Math.round(a.vinc/a.pos*100)}%;background:${a.vinc===a.pos?'var(--ok)':'var(--hl)'}"></i></div>`
      : '<span class="muted">—</span>';
    const acao = a.st==='proposta'
      ? `<button class="btn btn-filled btn-sm" onclick="verProposta('${a.prop}')">Ver proposta</button>`
      : a.st==='avincular'
        ? `<button class="btn btn-filled btn-sm" onclick="foraDoEscopo('Vincular profissional')">Vincular</button>`
        : `<button class="btn btn-outline btn-sm" onclick="foraDoEscopo('Abrir a alocação')">${a.st==='ativa'?'Abrir':'Acompanhar'}</button>`;
    return `<tr>
      <td><div class="strong">${esc(a.squad)}</div><div class="sub">${sub}${a.pedido!=='—'?' · Pedido '+esc(a.pedido):''}</div></td>
      <td>${vinc}</td>

      <td class="num">${BRL(a.valor)}</td>

        <th>Status</th><th></th></tr></thead>

     o scroll do corpo de volta para o topo a cada escolha de droplist */
  if(!repintando) trapFocus(d);
}
/* toda mudança de droplist do drawer passa por aqui, guardando quem disparou
   para devolver o foco ao mesmo campo depois de redesenhar */
function repintarPosicao(idFoco){
  if(state.drawer) state.drawer.foco=idFoco||null;
  pintarPosicao();
}
function fecharDrawer(){
  const d=$('#drawer'); if(!d.classList.contains('on')) return;
  fecharPop(); d.classList.remove('on');
  if(!$('#dialog').classList.contains('on')) $('#scrim').classList.remove('on');
  drawerAberto=false; releaseFocus(); state.drawer=null;
}
$('#scrim').addEventListener('click',()=>{ if(drawerAberto) fecharDrawer(); });

function abrirPosicao(){
  state.drawer={ contrato:'CLT', cargo:'', cons:'', horas:'176 h/mês',
    periodo:PERIODOS[0], dist:[novaDist()], erro:false };
  pintarPosicao();
}
function novaDist(){ return {tribo:'', squad:'', cc:'', capex:'', pct:'100%'}; }
const pctNum = s => Number(String(s).replace('%',''))||0;
function somaPct(){ return state.drawer.dist.reduce((s,d)=>s+pctNum(d.pct),0); }
function horasDaDist(d){
  const base=Number(String(state.drawer.horas).match(/\d+/)[0]);
  return Math.round(base*pctNum(d.pct)/100);
}
function posicaoValida(){
  const d=state.drawer;
  return !!(d.cargo && d.cons && somaPct()===100 &&
    d.dist.every(x=>x.tribo&&x.squad&&x.cc&&x.capex&&pctNum(x.pct)>0));
}
function pintarPosicao(){
  const corpoAnt=document.querySelector('#drawer .body');
  const repintando=drawerAberto && !!corpoAnt;
  const scrollAnt=corpoAnt?corpoAnt.scrollTop:0;
  const d=state.drawer, soma=somaPct(), ok=soma===100;
  const vh = RATE[d.cargo]||0;
  const blocos = d.dist.map((x,i)=>`
    <div class="card pad" style="padding:14px 16px">
      <div class="toolbar" style="margin-bottom:10px">
        <span class="kicker" style="flex:1 1 auto">Distribuição ${i+1}</span>
        ${d.dist.length>1?`<button class="iconbtn" aria-label="Remover distribuição ${i+1}"
          onclick="removerDist(${i})">${icon(I.x,16)}</button>`:''}</div>
      <div class="grid2">
        <span id="sl_tribo${i}"></span><span id="sl_squad${i}"></span>
        <span id="sl_cc${i}"></span><span id="sl_capex${i}"></span>
        <span id="sl_pct${i}"></span>
        <label class="field"><input type="text" value="${x.pct&&d.horas?horasDaDist(x)+' h':''}" disabled>
          <label>Horas no mês</label></label>
      </div>
    </div>`).join('');

  abrirDrawer(`
    <header><div class="t"><b>Adicionar posição</b>
      <span>${esc(state.nova.trilha==='posicoes'?'Demanda por posições':'Demanda por squad')} · nova alocação</span></div>
      <button class="iconbtn" aria-label="Fechar" onclick="fecharDrawer()">${icon(I.x,18)}</button></header>
    <div class="body">
      <span id="sl_contrato"></span>
      <span id="sl_cargo"></span>
      ${vh?`<div class="hintline">Rate Card vigente: <b>${BRL(vh)}/h</b> até 31/12/2026 — cobre todo o período.</div>`:''}
      <span id="sl_cons"></span>
      <div class="grid2"><span id="sl_horas"></span><span id="sl_periodo"></span></div>
      <div class="toolbar" style="margin-top:4px">
        <span class="kicker" style="flex:1 1 auto">Distribuição da alocação *</span>
        <span class="pill ${ok?'s-ativa':'s-avincular'}">${soma}% de 100%</span></div>
      ${d.erro&&!ok?`<div class="banner b-warn"><div><b>A distribuição precisa fechar 100%</b>
        Falta${soma>100?'m':''} ${Math.abs(100-soma)}% ${soma>100?'a mais do que o permitido':'para completar a alocação da posição'}.
        Cada fatia leva o seu próprio centro de custo e projeto Capex.</div></div>`:''}
      ${blocos}
      <button class="btn btn-text btn-sm" onclick="adicionarDist()">+ Adicionar distribuição</button>
    </div>
    <footer>
      <button class="btn btn-text" onclick="fecharDrawer()">Cancelar</button>
      <button class="btn btn-filled" onclick="salvarPosicao()">Adicionar posição</button></footer>`,
    repintando);

  const D=state.drawer;
  $('#sl_contrato').innerHTML=dlInit('contrato',{opcoes:CONTRATOS,sel:[D.contrato],label:'Tipo de contrato',
    placeholder:'Selecione',onChange:v=>{D.contrato=v[0]||'';}});
  $('#sl_cargo').innerHTML=dlInit('cargo',{opcoes:CARGOS,sel:D.cargo?[D.cargo]:[],label:'Cargo e senioridade *',
    placeholder:'Selecione o cargo',onChange:v=>{D.cargo=v[0]||'';repintarPosicao('cargo');},
    dica:'O cargo define o Rate Card — o valor/hora que a consultoria pode cobrar.'});
  $('#sl_cons').innerHTML=dlInit('cons',{opcoes:CONSULTORIAS,sel:D.cons?[D.cons]:[],label:'Consultoria *',
    placeholder:'Selecione a consultoria',onChange:v=>{D.cons=v[0]||'';repintarPosicao('cons');}});
  $('#sl_horas').innerHTML=dlInit('horas',{opcoes:HORAS,sel:[D.horas],label:'Quantidade de horas',
    placeholder:'Selecione',onChange:v=>{D.horas=v[0]||'';repintarPosicao('horas');}});
  $('#sl_periodo').innerHTML=dlInit('periodo',{opcoes:PERIODOS,sel:[D.periodo],label:'Período',
    placeholder:'Selecione',onChange:v=>{D.periodo=v[0]||'';}});
  D.dist.forEach((x,i)=>{
    $('#sl_tribo'+i).innerHTML=dlInit('tribo'+i,{opcoes:TRIBOS,sel:x.tribo?[x.tribo]:[],label:'Tribo *',
      placeholder:'Selecione',onChange:v=>{x.tribo=v[0]||'';x.squad='';repintarPosicao('tribo'+i);}});
    $('#sl_squad'+i).innerHTML=dlInit('squad'+i,{opcoes:SQUADS[x.tribo]||[],sel:x.squad?[x.squad]:[],
      label:'Squad *',placeholder:x.tribo?'Selecione':'Escolha a tribo antes',
      onChange:v=>{x.squad=v[0]||'';repintarPosicao('squad'+i);}});
    $('#sl_cc'+i).innerHTML=dlInit('cc'+i,{opcoes:CENTROS,sel:x.cc?[x.cc]:[],label:'Centro de custo *',
      placeholder:'Selecione',onChange:v=>{x.cc=v[0]||'';repintarPosicao('cc'+i);}});
    $('#sl_capex'+i).innerHTML=dlInit('capex'+i,{opcoes:CAPEX,sel:x.capex?[x.capex]:[],label:'Projeto Capex *',
      placeholder:'Selecione',onChange:v=>{x.capex=v[0]||'';repintarPosicao('capex'+i);}});
    $('#sl_pct'+i).innerHTML=dlInit('pct'+i,{opcoes:PCTS,sel:[x.pct],label:'% da alocação *',
      placeholder:'Selecione',onChange:v=>{x.pct=v[0]||'0%';repintarPosicao('pct'+i);}});
  });

  if(repintando){
    const corpo=document.querySelector('#drawer .body');
    if(corpo) corpo.scrollTop=scrollAnt;
    const alvo=D.foco && document.querySelector('#dl_'+D.foco+' > .trigger');
    if(alvo) alvo.focus({preventScroll:true});
    D.foco=null;
  }
}
function adicionarDist(){
  const d=state.drawer, falta=Math.max(0,100-somaPct());
  const nova=novaDist(); nova.pct=(PCTS.includes(falta+'%')?falta+'%':'50%');
  d.dist.push(nova); pintarPosicao();
  const novoBloco=document.querySelector('#sl_tribo'+(d.dist.length-1));
  if(novoBloco) novoBloco.scrollIntoView({block:'center',behavior:'smooth'});
}
function removerDist(i){ state.drawer.dist.splice(i,1); pintarPosicao(); }
function salvarPosicao(){
  const d=state.drawer;
  if(!posicaoValida()){ d.erro=true; pintarPosicao();
    /* aqui o scroll precisa subir: o aviso que explica o bloqueio fica no topo */
    const aviso=document.querySelector('#drawer .banner.b-warn');
    if(aviso) aviso.scrollIntoView({block:'center',behavior:'smooth'});
    toast(somaPct()!==100 ? 'A distribuição precisa somar 100% para a posição ser criada.'
                          : 'Preencha os campos obrigatórios da posição.',{kind:'bad'});
    return; }
  state.nova.posicoes.push({ contrato:d.contrato, cargo:d.cargo, cons:d.cons,
    horas:Number(String(d.horas).match(/\d+/)[0]), vh:RATE[d.cargo]||0,
    periodoLabel:d.periodo.split(' · ')[0], dist:d.dist.map(x=>({...x, pct:pctNum(x.pct)})) });
  fecharDrawer(); telaNova2();
  toast('Posição adicionada · '+d.cargo+' · '+d.cons,{kind:'ok'});
}

/* ============================================================
   A1 · passo 3 — revisão e envio por centro de custo
   ============================================================ */
function grupos(){
  const g={};
  state.nova.posicoes.forEach(p=>p.dist.forEach(d=>{
    const k=d.cc; g[k]=g[k]||{cc:k, itens:[], cons:new Set(), valor:0};
    const horas=Math.round(p.horas*d.pct/100)*6;
    g[k].itens.push({cargo:p.cargo, cons:p.cons, pct:d.pct, squad:d.squad, capex:d.capex,
      horas, valor:horas*p.vh});
    g[k].cons.add(p.cons); g[k].valor+=horas*p.vh;
  }));
  return Object.values(g);
}
function telaNova3(){
  const gs=grupos(), env=state.nova.enviados;
  const sel=gs.filter(g=>!env.includes(g.cc));

  const propostas=gs.filter(g=>!env.includes(g.cc)).reduce((s,g)=>s+g.cons.size,0);

  const cards=gs.map(g=>{
    const enviado=env.includes(g.cc);
    return `<div class="card" style="margin-top:16px">
      <div style="padding:14px 20px;border-bottom:1px solid var(--light-03)">
        <span class="kicker">Envio por centro de custo</span></div>

        <div style="flex:1 1 auto">
          <div class="strong">CC ${esc(g.cc)}</div>

            ${[...new Set(g.itens.map(i=>i.capex.split(' · ')[0]))].join(', ')}</div></div>
        <div style="text-align:right">
          <div class="strong">${BRL(g.valor)}</div>
          <div class="sub">${g.itens.length} ${g.itens.length===1?'distribuição':'distribuições'}</div></div>
      </div>
      <table class="tbl"><tbody>${g.itens.map(i=>`<tr>
        <td><div class="strong">${esc(i.cargo)}</div><div class="sub">${esc(i.cons)} · ${esc(i.squad)} · ${i.pct}% da posição</div></td>
        <td class="num">${NUM(i.horas)} h</td><td class="num">${BRL(i.valor)}</td></tr>`).join('')}</tbody></table>
      <div class="toolbar" style="padding:14px 20px;justify-content:flex-end">
        ${enviado ? '<span class="pill s-aguardando">Enviado à consultoria</span>'
                  : `<button class="btn btn-outline" onclick="dlgEnviarCC('${esc(g.cc)}')">Enviar</button>`}
      </div></div>`;
  }).join('');

  $('#content').innerHTML = `
    ${voltarPara('aloc','Alocações')}
    ${head('Revisão da demanda',
      'Passo 3 de 4 · escolha quais centros de custo vão agora — o que não for enviado fica em rascunho',
      '<span class="pill s-rascunho">Rascunho</span>')}
    ${passos(['Tipo da demanda','Posições e cargos','Revisão','Solicitar proposta'],2)}
    <div class="banner b-info"><div>
      <b>Valor a enviar · ${propostas} proposta(s) · ${sel.length} centro(s) de custo</b>
      <span style="font-size:22px;font-weight:700;display:block;margin:6px 0 4px">${BRL(total)}</span>
      Cada par consultoria × centro de custo vira uma proposta separada para a consultoria responder.
      O que não for enviado continua nesta alocação, em rascunho, e pode ser enviado depois sem refazer nada.</div></div>
    ${cards}`;
  footer(`<span class="hint">${env.length? env.length+' centro(s) de custo já enviado(s).' :
      'Ao enviar, só as posições dos centros de custo selecionados saem de rascunho.'}</span>
    <button class="btn btn-text" onclick="nav('nova2')">Voltar</button>
    <button class="btn ${env.length?'btn-filled':'btn-outline'}" onclick="concluirDemanda()">
      ${env.length?'Concluir':'Salvar rascunho'}</button>`);
}
function dlgEnviarCC(cc){
  const g=grupos().find(x=>x.cc===cc);
  openDialog(`<h2 id="dlgTitle">Enviar a demanda do CC ${esc(cc)}?</h2>
    <div class="body">
      <p class="muted" style="margin:0">A solicitação vai para ${[...g.cons].join(' e ')}.
        A consultoria monta a cotação com o valor/hora de cada posição e devolve a proposta para você decidir.</p>
      <div class="banner b-neutral"><div><b>${g.itens.length} ${g.itens.length===1?'distribuição':'distribuições'} · ${BRL(g.valor)}</b>
        ${g.cons.size} pedido${g.cons.size===1?'':'s'} de compra serão gerados quando a governança registrar a OC.</div></div>
    </div>
    <div class="acts"><button class="btn btn-text" onclick="closeDialog()">Cancelar</button>
      <button class="btn btn-filled" onclick="confirmarEnvio('${esc(cc)}')">Enviar solicitação</button></div>`);
}
function confirmarEnvio(cc){
  closeDialog();
  state.nova.enviados.push(cc);
  const g=grupos().find(x=>x.cc===cc);
  toast(`Solicitação enviada para ${[...g.cons].join(' e ')} · ${BRL(g.valor)}`,{kind:'ok'});
  concluir('A1','enviou o CC '+cc);
  telaNova3();
}
function concluirDemanda(){
  const n=state.nova, gs=grupos();
  const enviados=n.enviados.length;
  const squad = n.posicoes[0] && n.posicoes[0].dist[0] ? n.posicoes[0].dist[0].squad : 'Nova demanda';
  const valor = gs.filter(g=>n.enviados.includes(g.cc)).reduce((s,g)=>s+g.valor,0)/6;
  state.alocs.unshift({ id:'AL-4'+(10+state.alocs.length), squad, trilha:n.trilha,
    cons:[...new Set(n.posicoes.map(p=>p.cons))].join(' e '), pedido:'—',
    pos:n.posicoes.length, vinc:0, ini:'15/09/2026', fim:'14/03/2027',
    valor: Math.round(valor)||n.posicoes.reduce((s,p)=>s+p.horas*p.vh,0),
    st: enviados? 'aguardando' : 'rascunho' });
  state.nova=null;
  nav('aloc');
  toast(enviados? 'Demanda enviada · a alocação está aguardando a proposta da consultoria.'
                : 'Rascunho salvo em Alocações.',{kind:enviados?'ok':''});
}

    ${divs.length?`<div class="banner b-alert"><div>
      <b>${divs.length===1?'Uma posição voltou com cargo diferente do solicitado':

                <td class="num"><b style="white-space:nowrap">${dif>0?'+ ':'− '}${BRL(Math.abs(dif))}</b></td></tr>
            </tbody></table></div>
        <div class="card pad" style="margin-top:16px">

        </div>
      </div>
      <div>
        <div class="card pad">

function dlgAprovarNF(){
  const p=PE(state.id);
  openDialog(`<h2 id="dlgTitle">Aprovar o faturamento de ${esc(p.comp)}?</h2>
    <div class="body">
      <p class="muted" style="margin:0">O faturamento vai para Contas a Pagar com a nota anexada.
        Depois desta confirmação o período é encerrado.</p>
      <div class="banner b-neutral"><div><b>${esc(p.cons)} · ${BRL(p.nf.valor)}</b>
        Nota ${esc(p.nf.numero)} emitida em ${esc(p.nf.emissao)} · vencimento em ${esc(p.nf.venc)}</div></div>
    </div>
    <div class="acts"><button class="btn btn-text" onclick="closeDialog()">Cancelar</button>
      <button class="btn btn-filled" onclick="confirmarAprovarNF()">Aprovar faturamento</button></div>`);
}
function confirmarAprovarNF(){
  const p=PE(state.id); closeDialog();
  p.stage='concluido'; p.hist.unshift({t:'Faturamento aprovado',m:'14/08 · '+GESTOR.nome});
  concluir('F2','aprovou a nota como estava');
  nav('fat'); toast('Faturamento aprovado · enviado para Contas a Pagar.',{kind:'ok'});
}
/* ============================================================
   Enunciados das tarefas
   ============================================================ */
const TAREFAS = [
  { id:'A1', fluxo:'Alocação', min:8, rota:'aloc',
    titulo:'Pedir dois profissionais que ainda não existem',
    cenario:'A sua squad vai precisar de reforço a partir de 15 de setembro: um desenvolvedor front-end especialista e um analista de dados pleno, os dois por seis meses. Você ainda não sabe quem serão as pessoas — o RH e as consultorias resolvem isso depois. O front-end vai ser pago metade pelo centro de custo da sua área, o 20492 · Open Finance, e metade pelo 20488 · Dados & Analytics, que está bancando parte do projeto. Mostra para mim como você faria esse pedido.',
    partida:'Tela inicial de Alocações, visão Gestor, sem nada selecionado.' },
  { id:'A2', fluxo:'Alocação', min:6, rota:'aloc',
    titulo:'A consultoria respondeu a sua solicitação',
    cenario:'Alguns dias se passaram. A consultoria respondeu àquele mesmo pedido que você acabou de enviar — o desenvolvedor front-end especialista e o analista de dados pleno — e o time financeiro te cutucou: o valor que voltou está bem abaixo do que você pediu e eles querem entender por quê antes de seguir. Você precisa resolver isso hoje, porque o time depende dessas duas pessoas em setembro. O que você faz?',
    partida:'Tela de Alocações, visão Gestor. A alocação AL-407 · Open Finance — a mesma que você acabou de solicitar — está com a proposta da consultoria aguardando a sua decisão.' },
  { id:'F1', fluxo:'Faturamento', min:8, rota:'fat',
    titulo:'Fechar as horas do mês',
    cenario:'Hoje é dia 14 de agosto. A consultoria já lançou as horas que a equipe dela trabalhou na sua squad, e o processo parou esperando você. Sem a sua resposta, ninguém emite nota e ninguém recebe. Mostra para mim o que você faria.',
    partida:'Lista de períodos de faturamento, visão Gestor, sem filtro aplicado.' },
  { id:'F2', fluxo:'Faturamento', min:6, rota:'fat',
    titulo:'A nota fiscal veio com o valor errado',
    cenario:'Outro período, mais adiantado: a consultoria já emitiu a nota fiscal e mandou. O financeiro conferiu e te avisou que o valor da nota não bate com o faturamento que você aprovou — a nota veio mais alta. Resolve isso do seu lado.',
    partida:'Lista de períodos, visão Gestor. O período em Aprovação da NF está disponível na lista.' }
];
const TAREFA = id => TAREFAS.find(t=>t.id===id);

/* gancho de registro — opcional, definido fora deste arquivo */
function concluir(id,detalhe){ if(typeof registrarConclusao==='function') registrarConclusao(id,detalhe); }

/* volta os dados ao ponto de partida sem mexer no que é de sessão */
function reiniciarDados(){
  seed(); state.busca=''; state.buscaP=''; state.filtro=null; state.filtroF=null;
  state.nova=null; state.id=null;
}
function irParaTarefa(id){
  const t=TAREFA(id); if(!t) return;
  reiniciarDados(); state.tarefa=id; nav(t.rota);
  setTimeout(()=>{ const z=$('#toasts'); if(z) z.innerHTML=''; },60);
}

</script>
<script>
/* ============================================================
   Barra do enunciado — sempre à mão, para reler quantas vezes quiser
   ============================================================ */
const seq = TAREFAS.map(t=>t.id);
state.tarefa = (()=>{
  const h=(location.hash||'').replace('#','').toUpperCase();
  return seq.includes(h) ? h : seq[0];
})();

function barraTarefa(){
  const i=seq.indexOf(state.tarefa);
  const idx=$('#idx'), painel=$('#idxPanel');
  if(painel) painel.remove();
  idx.classList.remove('on');
  $('#idxBtn').innerHTML =
    `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/>
      <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
     Tarefa ${i+1} de ${seq.length} · ver enunciado`;
  $('#idxBtn').setAttribute('aria-expanded','false');
}
function dlgEnunciado(){
  const t=TAREFA(state.tarefa), i=seq.indexOf(t.id), ultima=i===seq.length-1;
  openDialog(`<h2 id="dlgTitle">Tarefa ${i+1} de ${seq.length}</h2>
    <div class="body">
      <div class="banner b-info"><div><b>${esc(t.titulo)}</b>
        ${esc(t.cenario)}</div></div>
      <p class="muted" style="margin:0">Pode reler este enunciado quando quiser, pelo botão no canto
        inferior da tela. Não existe resposta certa: o que a gente quer entender é como o sistema se
        comporta para você.</p>
    </div>
    <div class="acts">
      ${i>0?`<button class="btn btn-text left" onclick="trocarTarefa(-1)">Tarefa anterior</button>`:''}
      <button class="btn btn-text" onclick="closeDialog()">Fechar</button>
      ${ultima?'':`<button class="btn btn-outline" onclick="trocarTarefa(1)">Próxima tarefa</button>`}
      <button class="btn btn-filled" onclick="closeDialog()">Continuar</button></div>`);
}
function trocarTarefa(passo){
  const i=seq.indexOf(state.tarefa)+passo;
  if(i<0||i>=seq.length) return;
  closeDialog();
  irParaTarefa(seq[i]);
  barraTarefa();
  setTimeout(dlgEnunciado,320);
}
$('#idxBtn').addEventListener('click',e=>{ e.stopPropagation(); dlgEnunciado(); });
$('#bell').addEventListener('click',()=>toast('2 itens aguardando você.',
  {action:'Ver alocações',onAction:()=>nav('aloc')}));
$('#acct').addEventListener('click',()=>toast('O menu da conta não faz parte deste protótipo.'));

seed(); barraTarefa(); irParaTarefa(state.tarefa);
setTimeout(dlgEnunciado,400);

</script>
</body>
</html>
